function initialize(){
  for(const sec of Object.keys(defaults)){
    db.settings[sec]??=structuredClone(defaults[sec]);
    const cfg=db.settings[sec], def=defaults[sec];
    for(const t of def.types){
      if(!cfg.types.includes(t))cfg.types.push(t);
      cfg.categories[t]??=[];
      for(const c of def.categories[t])if(!cfg.categories[t].includes(c))cfg.categories[t].push(c);
    }
  }
  if(!db.seedImported20261024){
    const existing=new Set(db.items.map(x=>[x.section,x.type,x.category,x.title].join('|').toLowerCase()));
    for(const x of starterItems){
      const key=[x.section,x.type,x.category,x.title].join('|').toLowerCase();
      if(!existing.has(key)){db.items.push(x);existing.add(key)}
    }
    db.seedImported20261024=true;
  }
  save();
}

function importData(input){const f=input.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d.settings||!Array.isArray(d.items))throw Error('Geen geldige Picker-back-up');if(!confirm('Je huidige lijsten vervangen door de back-up?'))return;db=d;initialize();save();render();alert('Back-up geïmporteerd.')}catch(e){alert('Importeren mislukt: '+e.message)}};reader.readAsText(f)}
function btn(t,fn,primary=false){return `<button class="${primary?'primary':''}" onclick="${fn}">${t}</button>`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(s,sec){screen=s;if(sec)section=sec;render()}function active(){return db.items.filter(x=>x.section===section&&!x.done)}function weighted(xs,w){let total=xs.reduce((a,x)=>a+w(x),0),r=Math.random()*total;for(const x of xs){r-=w(x);if(r<0)return x}return xs.at(-1)}function pickCat(){let groups={};for(let x of active()){let k=x.type+' — '+x.category;(groups[k]??=[]).push(x)}let keys=Object.keys(groups);if(!keys.length){alert('Voeg eerst actieve items toe.');return}cat=weighted(keys,k=>groups[k].reduce((a,x)=>a+x.priority,0));chosen=null;render()}function pickItem(){let [type,category]=cat.split(' — ');let xs=active().filter(x=>x.type===type&&x.category===category);if(!xs.length){cat=null;render();return}chosen=weighted(xs,x=>x.priority);render()}function done(id){let x=db.items.find(x=>x.id===id);if(x){x.done=!x.done;save();render()}}function remove(id){if(confirm('Item verwijderen?')){db.items=db.items.filter(x=>x.id!==id);save();render()}}function options(a,val){return a.map(x=>`<option ${x===val?'selected':''}>${esc(x)}</option>`).join('')}function render(){if(screen==='home'){app.innerHTML=`<div class="card" style="text-align:center"><h2>Wat doe ik vanavond?</h2>${btn('🎬 Entertainment',"cat=null;chosen=null;go('picker','Entertainment')",true)}<br>${btn('🧶 Creatief',"cat=null;chosen=null;go('picker','Creatief')",true)}<p>${btn('⚙️ Mijn lijsten',"go('manage')")}</p></div>`;return}if(screen==='picker'){app.innerHTML=`${btn('← Start',"go('home')")}<div class="card"><h2>${section}</h2><h3>🎲 Kies een categorie</h3><p>${cat?esc(cat):'Nog geen categorie gekozen'}</p>${btn(cat?'Andere categorie':'Kies een categorie','pickCat()',true)}${cat?`<h3>🎲 Kies een ${section==='Creatief'?'project':'item'}</h3>${btn(chosen?'Opnieuw kiezen':'Kies een item','pickItem()',true)}${chosen?`<div class="card"><h2>${esc(chosen.title)}</h2><p>${esc(chosen.platform||'Geen platform')} · Prioriteit ${chosen.priority}</p>${btn(chosen.done?'Opnieuw activeren':'Markeer als voltooid',`done(${chosen.id})`)}</div>`:''}`:''}</div>${btn('🏠 Terug naar start',"go('home')")}`;return}if(screen==='manage'){app.innerHTML=`${btn('← Start',"go('home')")}<h2>Mijn lijsten</h2>${['Entertainment','Creatief'].map(s=>`<div class="card"><h3>${s}</h3>${btn('Mijn items',`go('list','${s}')`,true)}${btn('Types, categorieën en platformen',`go('settings','${s}')`)}</div>`).join('')}<div class='card'><h3>Back-up van je items</h3><p>Items worden automatisch op dit apparaat opgeslagen. Maak regelmatig een back-up, vooral vóór een nieuwe versie.</p>${btn('⬇ Exporteer back-up','exportData()',true)}<p><label>Back-up terugzetten <input type='file' accept='.json,application/json' onchange='importData(this)'></label></p></div>`;return}if(screen==='list'){app.innerHTML=`${btn('← Mijn lijsten',"go('manage')")}<h2>${section} — Mijn items</h2>${btn('+ Nieuw item',"edit=null;go('form')",true)}<input id="search" placeholder="Zoek titel..." oninput="drawList()"><div class="row"><select id="filterType" onchange="drawList()"><option value="">Alle types</option>${options(db.settings[section].types)}</select><select id="filterStatus" onchange="drawList()"><option value="all">Alles</option><option value="active">Actief</option><option value="done">Voltooid</option></select></div><div class="card" id="items"></div>`;document.getElementById('filterType').value='';drawList();return}if(screen==='form'){let x=edit===null?null:db.items.find(z=>z.id===edit),s=db.settings[section],type=x?.type||s.types[0];app.innerHTML=`${btn('← Mijn items',"go('list')")}<div class="card"><h2>${x?'Item bewerken':'Nieuw item'}</h2><label>Titel *</label><input id="title" value="${esc(x?.title||'')}"><label>Type *</label><select id="type" onchange="refreshCats()">${options(s.types,type)}</select>${btn('+ Nieuw type',"addOption('type')")}<label>Categorie *</label><select id="category"></select>${btn('+ Nieuwe categorie',"addOption('category')")}<label>Platform (optioneel)</label><select id="platform"><option value="">Geen</option>${options(s.platforms,x?.platform)}</select>${btn('+ Nieuw platform',"addOption('platform')")}<label>Prioriteit: <span id="pv">${x?.priority||3}</span> / 5</label><input id="priority" type="range" min="1" max="5" value="${x?.priority||3}" oninput="pv.textContent=this.value">${btn('Opslaan','store(false)',true)}${btn('Opslaan en nog één toevoegen','store(true)')}</div>`;refreshCats(x?.category);return}if(screen==='settings'){let s=db.settings[section];app.innerHTML=`${btn('← Mijn lijsten',"go('manage')")}<h2>${section} — Beheer</h2><div class="card"><h3>Types</h3>${s.types.map(t=>`<p>${esc(t)}</p>`).join('')}${btn('+ Type',"addOption('type')")}</div><div class="card"><h3>Categorieën</h3>${s.types.map(t=>`<p><b>${esc(t)}</b>: ${esc((s.categories[t]||[]).join(', '))}</p>`).join('')}${btn('+ Categorie',"addOption('category')")}</div><div class="card"><h3>Platformen</h3><p>${esc(s.platforms.join(', ')||'Geen')}</p>${btn('+ Platform',"addOption('platform')")}</div>`}}
function drawList(){let q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('filterType').value,status=document.getElementById('filterStatus').value;let xs=db.items.filter(x=>x.section===section&&x.title.toLowerCase().includes(q)&&(!t||x.type===t)&&(status==='all'||(status==='done')===x.done)).sort((a,b)=>a.title.localeCompare(b.title,'nl'));document.getElementById('items').innerHTML=xs.length?xs.map(x=>`<div class="item ${x.done?'muted':''}"><b>${esc(x.title)}</b> ${x.done?'✓':''}<br><small>${esc(x.type)} — ${esc(x.category)} · ${esc(x.platform||'Geen platform')} · ⭐ ${x.priority}</small><div>${btn(x.done?'Activeer':'Voltooid',`done(${x.id})`)}${btn('Bewerk',`edit=${x.id};go('form')`)}${btn('Verwijder',`remove(${x.id})`)}</div></div>`).join(''):'Geen items gevonden.'}function refreshCats(value){let t=document.getElementById('type').value,s=db.settings[section];document.getElementById('category').innerHTML=options(s.categories[t]||[],value)}function addOption(kind){let s=db.settings[section],type=document.getElementById('type')?.value||s.types[0];if(kind==='category'&&screen==='settings'){type=prompt('Voor welk type? ('+s.types.join(', ')+')',type);if(!s.types.includes(type))return}let v=prompt('Naam van '+(kind==='category'?'categorie':kind==='type'?'type':'platform')+':')?.trim();if(!v)return;if(kind==='type'){if(!s.types.includes(v)){s.types.push(v);s.categories[v]=[]} }else if(kind==='category'){s.categories[type]??=[];if(!s.categories[type].includes(v))s.categories[type].push(v)}else if(!s.platforms.includes(v))s.platforms.push(v);save();render();if(screen==='form'){if(kind==='type'){document.getElementById('type').value=v;refreshCats()}if(kind==='category')document.getElementById('category').value=v;if(kind==='platform')document.getElementById('platform').value=v}}function store(again){let title=document.getElementById('title').value.trim(),type=document.getElementById('type').value,category=document.getElementById('category').value,platform=document.getElementById('platform').value,priority=+document.getElementById('priority').value;if(!title||!type||!category){alert('Vul titel, type en categorie in.');return}let old=db.items.find(x=>x.id===edit);let data={id:old?.id||Date.now()+Math.floor(Math.random()*10000),section,title,type,category,platform,priority,done:old?.done||false};if(old)Object.assign(old,data);else db.items.push(data);save();if(again){edit=null;render();document.getElementById('type').value=type;refreshCats(category);document.getElementById('platform').value=platform}else go('list')}render();
</script></body></html>
