const STORE='picker_v1';
const deep=x=>JSON.parse(JSON.stringify(x));
const app=document.getElementById('app');

function normalize(raw){
 const out=deep(DEFAULT);
 if(!raw||!Array.isArray(raw.items))return out;
 out.items=raw.items.map(x=>({...x}));
 // Backups from earlier versions use Naaldwerk > Borduren and Organize in Creatief.
 for(const x of out.items){
  if(x.section==='Creatief'){
   if(x.type==='Naaldwerk'&&x.category==='Borduren')x.type='Borduren';
   else if(x.type==='Lego')x.type='LEGO';
   else if(x.type==='Organize')x.section='Admin';
   x.category='';x.platform='';
  }
  if(x.section==='Admin'){x.category='';x.platform=''}
  x.priority=Math.max(1,Math.min(5,Number(x.priority)||3));
 }
 // Imported backups retain any custom types and categories.
 for(const [sec,cfg] of Object.entries(raw.settings||{})){
  if(!out.settings[sec])continue;
  for(const t of cfg.types||[])if(sec!=='Creatief'||t!=='Naaldwerk'){
   if(sec!=='Creatief'||t!=='Organize')if(!out.settings[sec].types.includes(t))out.settings[sec].types.push(t);
  }
  if(sec==='Entertainment'){
   for(const [t,cats] of Object.entries(cfg.categories||{})){
    out.settings[sec].categories[t]??=[];
    for(const c of cats)if(!out.settings[sec].categories[t].includes(c))out.settings[sec].categories[t].push(c);
   }
   for(const p of cfg.platforms||[])if(!out.settings[sec].platforms.includes(p))out.settings[sec].platforms.push(p);
  }
  if(raw.schemaVersion>=2){Object.assign(out.settings[sec].weights,cfg.weights||{})}
 }
 // Merge missing seeded items only for an old backup. Match by stable ID, not title.
 if(raw.schemaVersion!==2){
  const ids=new Set(out.items.map(x=>String(x.id)));
  for(const x of DEFAULT.items)if(!ids.has(String(x.id)))out.items.push(deep(x));
  // Restore user-confirmed changed priorities for migrated Organize items.
  for(const x of out.items)if(x.section==='Admin'&&x.type==='Organize'){
   const overrides={'Alex raam':3,'Alex muur':2,'Witte dozen':5,'Schuiflades organiseren':1};
   if(overrides[x.title])x.priority=overrides[x.title];
  }
 }
 for(const x of out.items){
  const s=out.settings[x.section];if(!s)continue;
  if(!s.types.includes(x.type))s.types.push(x.type);
  if(x.section==='Entertainment'){
   s.categories[x.type]??=[];
   if(x.category&&!s.categories[x.type].includes(x.category))s.categories[x.type].push(x.category);
  }
 }
 return out;
}

function save(){try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){alert('Opslaan mislukt. Controleer de beschikbare opslagruimte.')}}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function q(v){return JSON.stringify(String(v)).replace(/"/g,'&quot;')}
function btn(label,fn,primary=false){return `<button class="${primary?'primary':''}" onclick="${fn}">${label}</button>`}
function go(s,sec){screen=s;if(sec)section=sec;render()}
function weighted(xs,weight){const total=xs.reduce((n,x)=>n+Math.max(0,weight(x)),0);if(!total)return null;let r=Math.random()*total;for(const x of xs){r-=Math.max(0,weight(x));if(r<0)return x}return xs[xs.length-1]}
function active(){return db.items.filter(x=>x.section===section&&!x.done)}
function groupKey(x){return section==='Entertainment'?x.type+'|'+x.category:x.type}
function groupLabel(key){return section==='Entertainment'?key.replace('|',' – '):key}
function groupWeight(key){return Number(db.settings[section].weights[key]??3)}
function pickCat(){
 if(section==='Sport'){chosen=weighted(db.settings.Sport.types,t=>groupWeight(t));render();return}
 const groups={};for(const x of active())(groups[groupKey(x)]??=[]).push(x);
 const keys=Object.keys(groups);
 if(!keys.length){alert('Voeg eerst actieve items toe.');return}
 cat=weighted(keys,k=>groupWeight(k)*groups[k].reduce((n,x)=>n+x.priority,0));chosen=null;render();
}
function pickItem(){const xs=active().filter(x=>groupKey(x)===cat);if(!xs.length){cat=null;chosen=null;render();return}chosen=weighted(xs,x=>x.priority);render()}
function done(id){const x=db.items.find(x=>String(x.id)===String(id));if(x){x.done=!x.done;save();render()}}
function remove(id){if(confirm('Dit item verwijderen?')){db.items=db.items.filter(x=>String(x.id)!==String(id));save();render()}}
function newItem(from){edit=null;returnScreen=from;go('form')}
function editItem(id,from){edit=id;returnScreen=from;go('form')}
function opts(xs,value){return xs.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='picker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(input){const file=input.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!parsed.settings||!Array.isArray(parsed.items))throw Error('Ongeldige Picker-back-up');if(!confirm('Je huidige items vervangen door deze back-up? Exporteer eerst je huidige gegevens als je ze wilt bewaren.'))return;db=normalize(parsed);save();cat=null;chosen=null;go('manage');alert('Back-up geïmporteerd.')}catch(e){alert('Importeren mislukt: '+e.message)}};reader.readAsText(file)}
function render(){
 if(screen==='home'){app.innerHTML=`<div class="card" style="text-align:center"><h2>Wat doe ik vandaag?</h2>${[['Entertainment','🎬'],['Creatief','🧶'],['Admin','📋'],['Sport','🏃']].map(([s,icon])=>`<p>${btn(icon+' '+s,`cat=null;chosen=null;go('picker',${q(s)})`,true)}</p>`).join('')}<p>${btn('⚙️ Mijn lijsten',"go('manage')")}</p></div>`;return}
 if(screen==='picker'){
  const sport=section==='Sport';
  app.innerHTML=`${btn('← Start',"go('home')")}<div class="card"><h2>${esc(section)}</h2><h3>🎲 ${sport?'Kies een activiteit':'Kies een type'}</h3><p>${sport?(chosen?esc(chosen):'Nog geen activiteit gekozen'):(cat?esc(groupLabel(cat)):'Nog geen type gekozen')}</p>${btn(sport?(chosen?'Opnieuw kiezen':'Kies een activiteit'):(cat?'Ander type':'Kies een type'),'pickCat()',true)}${!sport&&cat?`<h3>🎲 Kies een item</h3>${btn(chosen?'Opnieuw kiezen':'Kies een item','pickItem()',true)}${chosen?`<div class="card"><h2>${esc(chosen.title)}</h2><p>Prioriteit ${chosen.priority}${section==='Entertainment'&&chosen.platform?' · '+esc(chosen.platform):''}</p>${btn('✏️ Bewerken',`editItem(${q(chosen.id)},'picker')`)}${btn(chosen.done?'Opnieuw activeren':'Markeer als voltooid',`done(${q(chosen.id)})`)}</div>`:''}`:''}${sport&&chosen?`<p>Prioriteit ${groupWeight(chosen)}</p>`:''}<p>${btn('+ Nieuw item',sport?"go('settings')":"newItem('picker')")}</p></div>${btn('🏠 Terug naar start',"go('home')")}`;return
 }
 if(screen==='manage'){
  app.innerHTML=`${btn('← Start',"go('home')")}<h2>Mijn lijsten</h2>${Object.keys(db.settings).map(s=>`<div class="card"><h3>${esc(s)}</h3>${s==='Sport'?'':btn('Mijn items',`go('list',${q(s)})`,true)}${btn('Types en prioriteiten',`go('settings',${q(s)})`)}</div>`).join('')}<div class="card"><h3>Back-up</h3><p>Items worden automatisch op dit apparaat opgeslagen. Maak regelmatig een back-up.</p>${btn('⬇ Exporteer back-up','exportData()',true)}<p><label>Back-up terugzetten <input type="file" accept=".json,application/json" onchange="importData(this)"></label></p></div>`;return
 }
 if(screen==='list'){
  app.innerHTML=`${btn('← Mijn lijsten',"go('manage')")}<h2>${esc(section)} — Mijn items</h2>${btn('+ Nieuw item',"newItem('list')",true)}<input id="search" placeholder="Zoek titel..." oninput="drawList()"><div class="row"><select id="filterType" onchange="drawList()"><option value="">Alle types</option>${opts(db.settings[section].types)}</select><select id="filterStatus" onchange="drawList()"><option value="all">Alles</option><option value="active">Actief</option><option value="done">Voltooid</option></select></div><div class="card" id="items"></div>`;document.getElementById('filterType').value='';drawList();return
 }
 if(screen==='form'){
  if(section==='Sport'){go('settings');return}
  const x=edit==null?null:db.items.find(z=>String(z.id)===String(edit)),s=db.settings[section],type=x?.type||s.types[0];
  app.innerHTML=`${btn('← Terug',`go(${q(returnScreen)})`)}<div class="card"><h2>${x?'Item bewerken':'Nieuw item'}</h2><label>Titel *</label><input id="title" value="${esc(x?.title||'')}"><label>Type *</label><select id="type" onchange="refreshCats()">${opts(s.types,type)}</select>${btn('+ Nieuw type',"addOption('type')")}${section==='Entertainment'?`<label>Categorie *</label><select id="category"></select>${btn('+ Nieuwe categorie',"addOption('category')")}<label>Platform (optioneel)</label><select id="platform"><option value="">Geen</option>${opts(s.platforms,x?.platform)}</select>${btn('+ Nieuw platform',"addOption('platform')")}`:''}<label>Prioriteit: <span id="pv">${x?.priority||3}</span> / 5</label><input id="priority" type="range" min="1" max="5" value="${x?.priority||3}" oninput="document.getElementById('pv').textContent=this.value">${btn('Opslaan','store(false)',true)}${btn('Opslaan en nog één toevoegen','store(true)')}</div>`;
  if(section==='Entertainment')refreshCats(x?.category);return
 }
 if(screen==='settings'){
  const s=db.settings[section];
  const rows=section==='Entertainment'?s.types.flatMap(t=>(s.categories[t]||[]).map(c=>[t+'|'+c,t+' – '+c])):s.types.map(t=>[t,t]);
  app.innerHTML=`${btn('← Mijn lijsten',"go('manage')")}<h2>${esc(section)} — Prioriteiten</h2><div class="card"><p>Prioriteit van 1 tot 5. De kans op een type is de prioriteit × de som van de actieve itemprioriteiten.</p>${rows.map(([key,label])=>`<div class="item"><label>${esc(label)} — <b id="w-${keyId(key)}">${groupWeight(key)}</b>/5</label><input type="range" min="1" max="5" value="${groupWeight(key)}" oninput="setWeight(${q(key)},this.value)"></div>`).join('')}${btn('Opslaan','save();alert("Prioriteiten opgeslagen.")',true)}</div><div class="card"><h3>Types ${section==='Entertainment'?'en categorieën':''}</h3>${btn('+ Nieuw type',"addOption('type')")}${section==='Entertainment'?btn('+ Nieuwe categorie',"addOption('category')")+btn('+ Nieuw platform',"addOption('platform')"):''}${section==='Sport'?'<p>Sport is één rechtstreekse randomizer. Elk type is een activiteit.</p>':''}</div>`;return
 }
}
function keyId(k){return [...k].map(c=>c.charCodeAt(0).toString(16)).join('-')}
function setWeight(key,value){db.settings[section].weights[key]=Number(value);document.getElementById('w-'+keyId(key)).textContent=value;save()}
function drawList(){const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('filterType').value,status=document.getElementById('filterStatus').value;const xs=db.items.filter(x=>x.section===section&&x.title.toLowerCase().includes(q)&&(!t||x.type===t)&&(status==='all'||(status==='done')===!!x.done)).sort((a,b)=>a.title.localeCompare(b.title,'nl'));document.getElementById('items').innerHTML=xs.length?xs.map(x=>`<div class="item ${x.done?'muted':''}"><b>${esc(x.title)}</b> ${x.done?'✓':''}<br><small>${esc(x.type)}${section==='Entertainment'?' – '+esc(x.category):''}${section==='Entertainment'&&x.platform?' · '+esc(x.platform):''} · ⭐ ${x.priority}</small><div>${btn(x.done?'Activeer':'Voltooid',`done(${qId(x.id)})`)}${btn('Bewerk',`editItem(${qId(x.id)},'list')`)}${btn('Verwijder',`remove(${qId(x.id)})`)}</div></div>`).join(''):'Geen items gevonden.'}
function qId(id){return JSON.stringify(id)}
function refreshCats(value){if(section!=='Entertainment')return;const t=document.getElementById('type').value;document.getElementById('category').innerHTML=opts(db.settings[section].categories[t]||[],value)}
function addOption(kind){const s=db.settings[section];let type=document.getElementById('type')?.value||s.types[0];if(kind==='category'&&screen==='settings'){type=prompt('Voor welk type? ('+s.types.join(', ')+')',type);if(!s.types.includes(type))return}const value=prompt('Naam van '+(kind==='category'?'categorie':kind==='type'?'type':'platform')+':')?.trim();if(!value)return;
 if(kind==='type'){if(!s.types.includes(value)){s.types.push(value);s.weights[value]=3;if(section==='Entertainment')s.categories[value]=[]}}
 else if(kind==='category'){s.categories[type]??=[];if(!s.categories[type].includes(value))s.categories[type].push(value);s.weights[type+'|'+value]=3}
 else if(!s.platforms.includes(value))s.platforms.push(value);
 save();if(screen==='settings')render();else if(screen==='form'){
  const title=document.getElementById('title').value,priority=document.getElementById('priority').value,oldType=document.getElementById('type').value,oldCat=section==='Entertainment'?document.getElementById('category').value:'',oldPlatform=section==='Entertainment'?document.getElementById('platform').value:'';
  const existing=edit;render();edit=existing;document.getElementById('title').value=title;document.getElementById('priority').value=priority;document.getElementById('pv').textContent=priority;document.getElementById('type').value=kind==='type'?value:oldType;
  if(section==='Entertainment'){refreshCats(kind==='category'?value:oldCat);document.getElementById('platform').value=kind==='platform'?value:oldPlatform}
 }
}
function store(again){const title=document.getElementById('title').value.trim(),type=document.getElementById('type').value,category=section==='Entertainment'?document.getElementById('category').value:'',platform=section==='Entertainment'?document.getElementById('platform').value:'',priority=Number(document.getElementById('priority').value);if(!title||!type||(section==='Entertainment'&&!category)){alert('Vul titel, type en eventuele categorie in.');return}const old=db.items.find(x=>String(x.id)===String(edit));const item={id:old?.id??Date.now()+Math.floor(Math.random()*100000),section,type,category,title,platform,priority,done:old?.done||false};if(old)Object.assign(old,item);else db.items.push(item);save();if(again){edit=null;render();document.getElementById('type').value=type;if(section==='Entertainment'){refreshCats(category);document.getElementById('platform').value=platform}}else{if(returnScreen==='picker'){chosen=item;cat=groupKey(item)}go(returnScreen)}}
render();

</script></body></html>
