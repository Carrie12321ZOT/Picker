 if(screen==='picker'){
  const sport=section==='Sport';
  app.innerHTML=`${btn('← Start',"go('home')")}<div class="card"><h2>${esc(section)}</h2><div class="picker-heading"><h3>🎲 ${sport?'Kies een activiteit':'Kies een type'}</h3>${btn(sport?(chosen?'Opnieuw kiezen':'Kies een activiteit'):(cat?'Ander type':'Kies een type'),'pickCat()',true)}</div><p class="picker-selection">${sport?(chosen?esc(chosen):'Nog geen activiteit gekozen'):(cat?esc(groupLabel(cat)):'Nog geen type gekozen')}</p>${!sport&&cat?`<div class="picker-heading"><h3>🎲 Kies een item</h3>${btn(chosen?'Opnieuw kiezen':'Kies een item','pickItem()',true)}</div>${chosen?`<div class="card compact-result"><div class="compact-row"><div class="compact-name"><strong>${esc(chosen.title)}</strong><span class="compact-meta">${esc(chosen.type)}${chosen.category?' · '+esc(chosen.category):''}${section==='Entertainment'&&chosen.platform?' · '+esc(chosen.platform):''}${chosen.status?' · Status: '+esc(chosen.status):''}</span></div><span class="compact-priority">⭐ ${chosen.priority}</span><div class="compact-actions"><button class="icon-btn" title="Bewerken" aria-label="Bewerken" onclick="editItem(${q(chosen.id)},'picker')">✏️</button><button class="icon-btn" title="${chosen.done?'Opnieuw activeren':'Markeer als voltooid'}" aria-label="${chosen.done?'Opnieuw activeren':'Markeer als voltooid'}" onclick="done(${q(chosen.id)})">${chosen.done?'↩️':'✓'}</button></div></div></div>`:''}`:''}${sport&&chosen?`<p>Prioriteit ${groupWeight(chosen)}</p>`:''}</div><div class="picker-footer">${btn('🏠 Terug naar start',"go('home')")}${btn('+ Nieuw item',sport?"go('settings')":"newItem('picker')")}</div>`;return
 }
 if(screen==='manage'){
  app.innerHTML=`${btn('← Start',"go('home')")}<h2>Mijn lijsten</h2>${Object.keys(db.settings).map(s=>`<div class="card compact-section manage-row"><h3>${esc(s)}</h3><div class="row">${s==='Sport'?'':btn('Mijn items',`go('list',${q(s)})`,true)}${btn('Types & prioriteiten',`go('settings',${q(s)})`)}</div></div>`).join('')}<div class="card"><h3>Back-up</h3><small>Items worden automatisch op dit apparaat opgeslagen. Maak regelmatig een back-up.</small><div>${btn('⬇ Exporteer back-up','exportData()',true)}</div><label>Back-up terugzetten <input type="file" accept=".json,application/json" onchange="importData(this)"></label></div>`;return
 }
 if(screen==='list'){
  app.innerHTML=`${btn('← Mijn lijsten',"go('manage')")}<h2>${esc(section)} — Mijn items</h2><div class="toolbar"><input id="search" placeholder="Zoek titel..." oninput="drawList()">${btn('+ Nieuw item',"newItem('list')",true)}</div><div class="toolbar"><select id="sortBy" onchange="drawList()"><option value="name">Naam</option><option value="priority">Prioriteit</option><option value="type">Type</option><option value="category">Categorie / subcategorie</option>${section==='Entertainment'?'<option value="status">Seriestatus</option><option value="platform">Platform</option>':''}<option value="completed">Actief / voltooid</option></select><select id="sortDir" onchange="drawList()"><option value="asc">Oplopend ↑</option><option value="desc">Aflopend ↓</option></select><button onclick="toggleFilters()" id="filterToggle" aria-expanded="false">☷ Filters ▾</button></div><div id="filterPanel" class="filter-panel hidden"><div class="filter-grid"><label>Type<select id="filterType" onchange="refreshListFilters();drawList()"><option value="">Alle types</option>${opts(db.settings[section].types)}</select></label><label>Categorie / subcategorie<select id="filterCategory" onchange="drawList()"><option value="">Alle categorieën</option></select></label>${section==='Entertainment'?'<label>Platform<select id="filterPlatform" onchange="drawList()"><option value="">Alle platforms</option></select></label><label>Seriestatus<select id="filterSeriesStatus" onchange="drawList()"><option value="">Alle statussen</option></select></label>':''}<label>Prioriteit<select id="filterPriority" onchange="drawList()"><option value="">Alle prioriteiten</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label><label>Voltooiing<select id="filterStatus" onchange="drawList()"><option value="all">Alles</option><option value="active">Actief</option><option value="done">Voltooid</option></select></label></div></div><div class="card compact-list" id="items"></div>`;refreshListFilters();drawList();return
 }
 if(screen==='form'){
  if(section==='Sport'){go('settings');return}
  const x=edit==null?null:db.items.find(z=>String(z.id)===String(edit)),s=db.settings[section],type=x?.type||s.types[0];
  app.innerHTML=`${btn('← Terug',`go(${q(returnScreen)})`)}<div class="card"><h2>${x?'Item bewerken':'Nieuw item'}</h2><label>Titel *</label><input id="title" value="${esc(x?.title||'')}"><label>Type *</label><select id="type" onchange="refreshCats()">${opts(s.types,type)}</select>${btn('+ Nieuw type',"addOption('type')")}${section==='Entertainment'?`<label>Categorie *</label><select id="category"></select>${btn('+ Nieuwe categorie',"addOption('category')")}<label>Platform (optioneel)</label><select id="platform"><option value="">Geen</option>${opts(s.platforms,x?.platform)}</select>${btn('+ Nieuw platform',"addOption('platform')")}`:''}${section==='Entertainment'&&type==='Serie'?`<label>Status (informatie)</label><input id="seriesStatus" value="${esc(x?.status||'')}" placeholder="Next, Current, Nieuw...">`:''}<label>Prioriteit: <span id="pv">${x?.priority??3}</span> / 5</label><input id="priority" type="range" min="${section==='Entertainment'?0:1}" max="5" value="${x?.priority??3}" oninput="document.getElementById('pv').textContent=this.value">${btn('Opslaan','store(false)',true)}${btn('Opslaan en nog één toevoegen','store(true)')}</div>`;
  if(section==='Entertainment')refreshCats(x?.category);return
 }
 if(screen==='settings'){
  const s=db.settings[section];
  const rows=section==='Entertainment'?s.types.flatMap(t=>(s.categories[t]||[]).map(c=>[t+'|'+c,t+' – '+c])):s.types.map(t=>[t,t]);
  app.innerHTML=`${btn('← Mijn lijsten',"go('manage')")}<h2>${esc(section)} — Prioriteiten</h2><div class="card"><p>Prioriteit van 1 tot 5. De kans op een type is de prioriteit × de som van de actieve itemprioriteiten.</p>${rows.map(([key,label])=>`<div class="item"><label>${esc(label)} — <b id="w-${keyId(key)}">${groupWeight(key)}</b>/5</label><input type="range" min="1" max="5" value="${groupWeight(key)}" oninput="setWeight(${q(key)},this.value)"></div>`).join('')}${btn('Opslaan','save();alert("Prioriteiten opgeslagen.")',true)}</div><div class="card"><h3>Types ${section==='Entertainment'?'en categorieën':''}</h3>${btn('+ Nieuw type',"addOption('type')")}${section==='Entertainment'?btn('+ Nieuwe categorie',"addOption('category')")+btn('+ Nieuw platform',"addOption('platform')"):''}${section==='Sport'?'<p>Sport is één rechtstreekse randomizer. Elk type is een activiteit.</p>':''}<h3>Types verwijderen</h3><p><small>Bij verwijderen worden ook gekoppelde items verwijderd. Er wordt altijd eerst om bevestiging gevraagd.</small></p>${s.types.map(t=>`<div class="item"><b>${esc(t)}</b> ${btn('🗑 Verwijder type',`deleteType(${q(t)})`)}</div>`).join('')}${section==='Entertainment'?`<h3>Categorieën verwijderen</h3>${s.types.flatMap(t=>(s.categories[t]||[]).map(c=>`<div class="item"><b>${esc(t)} – ${esc(c)}</b> ${btn('🗑 Verwijder categorie',`deleteCategory(${q(t)},${q(c)})`)}</div>`)).join('')}`:''}</div>`;return
 }
}
function keyId(k){return [...k].map(c=>c.charCodeAt(0).toString(16)).join('-')}
function setWeight(key,value){db.settings[section].weights[key]=Number(value);document.getElementById('w-'+keyId(key)).textContent=value;save()}
function toggleFilters(){const panel=document.getElementById('filterPanel'),open=panel.classList.toggle('hidden')===false;document.getElementById('filterToggle').textContent=open?'☷ Filters ▴':'☷ Filters ▾';document.getElementById('filterToggle').setAttribute('aria-expanded',String(open))}
function refreshListFilters(){
 const t=document.getElementById('filterType').value;
 const xs=db.items.filter(x=>x.section===section&&(!t||x.type===t));
 const fill=(id,values)=>{const el=document.getElementById(id);if(!el)return;const prev=el.value;el.innerHTML='<option value="">Alle '+(id==='filterCategory'?'categorieën':id==='filterPlatform'?'platforms':'statussen')+'</option>'+opts([...new Set(values.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl')));el.value=[...el.options].some(o=>o.value===prev)?prev:''};
 fill('filterCategory',xs.map(x=>x.category));fill('filterPlatform',xs.map(x=>x.platform));fill('filterSeriesStatus',xs.filter(x=>x.type==='Serie').map(x=>x.status));
}
function drawList(){
 const val=id=>document.getElementById(id)?.value||'';
 const search=val('search').toLocaleLowerCase('nl'),t=val('filterType'),category=val('filterCategory'),platform=val('filterPlatform'),seriesStatus=val('filterSeriesStatus'),priority=val('filterPriority'),status=val('filterStatus')||'all',sort=val('sortBy'),direction=val('sortDir')==='desc'?-1:1;
 const xs=db.items.filter(x=>x.section===section&&x.title.toLocaleLowerCase('nl').includes(search)&&(!t||x.type===t)&&(!category||x.category===category)&&(!platform||x.platform===platform)&&(!seriesStatus||x.status===seriesStatus)&&(priority===''||Number(x.priority)===Number(priority))&&(status==='all'||(status==='done')===!!x.done));
 const field=x=>sort==='name'?x.title:sort==='priority'?Number(x.priority):sort==='type'?x.type:sort==='category'?x.category||'':sort==='platform'?x.platform||'':sort==='status'?x.status||'':sort==='completed'?Number(!!x.done):x.title;
 xs.sort((a,b)=>{const av=field(a),bv=field(b);const cmp=typeof av==='number'&&typeof bv==='number'?av-bv:String(av).localeCompare(String(bv),'nl',{sensitivity:'base'});return direction*cmp||a.title.localeCompare(b.title,'nl')});
 document.getElementById('items').innerHTML=xs.length?xs.map(x=>`<div class="compact-row ${x.done?'muted':''}"><div class="compact-name"><strong>${esc(x.title)}${x.done?' ✓':''}</strong><span class="compact-meta">${esc(x.type)}${x.category?' · '+esc(x.category):''}</span></div><span class="compact-priority">⭐${x.priority}</span><div class="compact-actions">${iconBtn('✎','Bewerk '+x.title,`editItem(${qId(x.id)},'list')`)}${iconBtn(x.done?'↺':'✓',x.done?'Opnieuw activeren':'Voltooien',`done(${qId(x.id)})`)}${iconBtn('🗑','Verwijder '+x.title,`remove(${qId(x.id)})`)}</div></div>`).join(''):'Geen items gevonden.';
}
function qId(id){return JSON.stringify(id)}
function refreshCats(value){if(section!=='Entertainment')return;const t=document.getElementById('type').value;document.getElementById('category').innerHTML=opts(db.settings[section].categories[t]||[],value)}
function addOption(kind){const s=db.settings[section];let type=document.getElementById('type')?.value||s.types[0];if(kind==='category'&&screen==='settings'){type=prompt('Voor welk type? ('+s.types.join(', ')+')',type);if(!s.types.includes(type))return}const value=prompt('Naam van '+(kind==='category'?'categorie':kind==='type'?'type':'platform')+':')?.trim();if(!value)return;
 if(kind==='type'){if(!s.types.includes(value)){s.types.push(value);s.weights[value]=3;if(section==='Entertainment')s.categories[value]=[]}}
 else if(kind==='category'){s.categories[type]??=[];if(!s.categories[type].includes(value))s.categories[type].push(value);s.weights[type+'|'+value]=3}
 else if(!s.platforms.includes(value))s.platforms.push(value);
 save();if(screen==='settings')render();else if(screen==='form'){
  const title=document.getElementById('title').value,priority=document.getElementById('priority').value,oldType=document.getElementById('type').value,oldCat=section==='Entertainment'?document.getElementById('category').value:'',oldPlatform=section==='Entertainment'?document.getElementById('platform').value:'';
  const existing=edit;render();edit=existing;document.getElementById('title').value=title;document.getElementById('priority').value=priority;document.getElementById('pv').textContent=priority;document.getElementById('type').value=kind==='type'?value:oldType;
  if(section==='Entertainment'){refreshCats(kind==='category'?value:oldCat);document.getElementById('platform').value=kind==='platform'?value:oldPlatform}
 }
}
function store(again){const title=document.getElementById('title').value.trim(),type=document.getElementById('type').value,category=section==='Entertainment'?document.getElementById('category').value:'',platform=section==='Entertainment'?document.getElementById('platform').value:'',priority=Number(document.getElementById('priority').value);if(!title||!type||(section==='Entertainment'&&!category)){alert('Vul titel, type en eventuele categorie in.');return}const old=db.items.find(x=>String(x.id)===String(edit));const item={id:old?.id??Date.now()+Math.floor(Math.random()*100000),section,type,category,title,platform,priority,done:old?.done||false};if(section==='Entertainment'&&type==='Serie')item.status=document.getElementById('seriesStatus')?.value??old?.status??'';if(old)Object.assign(old,item);else db.items.push(item);save();if(again){edit=null;render();document.getElementById('type').value=type;if(section==='Entertainment'){refreshCats(category);document.getElementById('platform').value=platform}}else{if(returnScreen==='picker'){chosen=item;cat=groupKey(item)}go(returnScreen)}}
render();

</script></body></html>
